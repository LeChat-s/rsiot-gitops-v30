name: gitops-ci

on:
  push:
    branches: [main]
    paths:
      - "app/**"
  workflow_dispatch:

permissions:
  contents: write
  packages: write

concurrency:
  group: rules-main-cd
  cancel-in-progress: false

jobs:
  test-build-push-bump:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run unit tests
        working-directory: app
        run: python -m unittest discover -s tests -v

      - name: Compute immutable image tag
        id: image
        shell: bash
        run: |
          echo "full=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/rules:${GITHUB_SHA}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Sign in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish image
        uses: docker/build-push-action@v6
        with:
          context: ./app
          file: ./app/Dockerfile
          push: true
          tags: ${{ steps.image.outputs.full }}
          build-args: |
            VCS_REF=${{ github.sha }}

      - name: Bump image in GitOps manifests and push bot commit
        shell: bash
        env:
          IMAGE: ${{ steps.image.outputs.full }}
        run: |
          set -euo pipefail
          python scripts/update_image.py "$IMAGE"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add infra/deployment.yaml
          if git diff --cached --quiet; then
            echo "Image already pinned; no commit necessary"
          else
            git commit -m "chore(gitops): deploy ${GITHUB_SHA}"
            git push origin HEAD:main
          fi
